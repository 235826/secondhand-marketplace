{% macro fields(id, revision=0) %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="id" value="{{ id }}"><input type="hidden" name="revision" value="{{ revision }}">{% endmacro %}
{% macro action(name, id, label, revision=0, danger=false) %}<form method="post" action="{{ url_for('action',action=name) }}">{{ fields(id,revision) }}<button class="{{ 'danger' if danger else 'secondary' }}">{{ label }}</button></form>{% endmacro %}
{% macro badge(status) %}<span class="badge status-{{ status }}">{{ labels.get(status,status) }}</span>{% endmacro %}
