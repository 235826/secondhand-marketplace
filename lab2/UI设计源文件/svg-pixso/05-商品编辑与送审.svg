" x2="398" y2="164" stroke="#E5E7EB" stroke-width="1"/><circle cx="434" cy="164" r="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" opacity="1"/><text x="434" y="169" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13" fill="#6B7280" font-weight="700" text-anchor="middle">3</text><text x="458" y="169" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start">审核发布</text><rect x="40" y="200" width="840" height="520" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="64" y="236" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">商品名称 *</text><rect x="64" y="244" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="78" y="271.0" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13" fill="#111827" font-weight="400" text-anchor="start">iPad Air 5 64G 蓝色</text><text x="464" y="236" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">商品分类 *</text><rect x="464" y="244" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><g transform="translate(478,257.0) scale(0.75)"><path d="M6 9l6 6 6-6" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="506" y="271.0" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13" fill="#111827" font-weight="400" text-anchor="start">数码产品</text><text x="64" y="310" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">价格（元）*</text><rect x="64" y="318" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="78" y="345.0" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13" fill="#111827" font-weight="400" text-anchor="start">2680</text><text x="264" y="310" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">成色 *</text><rect x="264" y="318" width="180" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><g transform="translate(278,331.0) scale(0.75)"><path d="M6 9l6 6 6-6" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="306" y="345.0" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13" fill="#111827" font-weight="400" text-anchor="start">95 新</text><text x="464" y="310" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">交易地点 *</text><rect x="464" y="318" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="478" y="345.0" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="13" fill="#111827" font-weight="400" text-anchor="start">仙林校区 · 四组团</text><text x="64" y="386" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">商品图片 *</text><rect x="64" y="396" width="118" height="80" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="6 5"/><g transform="translate(111,420) scale(1.0)"><path d="M12 5v14M5 12h14" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="123" y="464" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="10" fill="#9CA3AF" font-weight="400" text-anchor="middle">上传图片</text><rect x="196" y="396" width="118" height="80" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="6 5"/><g transform="translate(243,420) scale(1.0)"><path d="M12 5v14M5 12h14" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="255" y="464" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="10" fill="#9CA3AF" font-weight="400" text-anchor="middle">上传图片</text><rect x="328" y="396" width="118" height="80" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="6 5"/><g transform="translate(375,420) scale(1.0)"><path d="M12 5v14M5 12h14" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="387" y="464" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="10" fill="#9CA3AF" font-weight="400" text-anchor="middle">上传图片</text><text x="470" y="420" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">第一张图片将作为封面；支持 JPG / PNG，单张不超过 5MB。</text><text x="470" y="440" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">至少上传 1 张，最多 9 张。</text><text x="64" y="506" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">商品描述 *</text><rect x="64" y="514" width="780" height="70" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="78" y="538" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">自用 iPad Air 5，64G，蓝色，无磕碰，电池健康 92%。含原装充电器和保护壳。</text><text x="78" y="558" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">因换新出售，可在仙林校区当面验机。</text><text x="64" y="608" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="600" text-anchor="start">备注 *</text><rect x="64" y="616" width="780" height="58" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="78" y="638" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#9CA3AF" font-weight="400" text-anchor="start">补充说明，例如发票、保修情况、可交易时间等。</text><text x="78" y="658" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11" fill="#D97706" font-weight="400" text-anchor="start">备注为必填项；提交审核前请确认信息完整、价格合法。</text><rect x="910" y="200" width="416" height="520" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="934" y="238" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start">发布须知</text><text x="934" y="274" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">1. 商品需填写名称、描述、分类、价格、成色、图片、交易地点和备注。</text><text x="934" y="302" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">2. 提交后进入待审核状态，审核通过后才会公开。</text><text x="934" y="330" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">3. 修改已发布商品会进入重审，期间暂停成交。</text><text x="934" y="358" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">4. 不得发布违规物品；管理员有权下架或封禁。</text><rect x="934" y="406" width="368" height="76" rx="10" fill="#EFF6FF" stroke="none" stroke-width="1" opacity="1"/><g transform="translate(950,424) scale(0.8333333333333334)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="980" y="430" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#2563EB" font-weight="700" text-anchor="start">审核通过后自动发布</text><text x="980" y="450" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">审核一般在 1 个工作日内完成。</text><rect x="934" y="500" width="368" height="50" rx="10" fill="#F3F4F6" stroke="none" stroke-width="1" opacity="1"/><text x="950" y="520" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">当前状态</text><rect x="1000" y="508" width="64" height="24" rx="12" fill="#FEF3C7" stroke="none" stroke-width="1" opacity="1"/><text x="1032.0" y="524" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="12" fill="#D97706" font-weight="600" text-anchor="middle">待审核</text><text x="1150" y="520" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11" fill="#6B7280" font-weight="400" text-anchor="start">保存后仍可继续编辑</text><rect x="934" y="620" width="174" height="46" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" opacity="1"/><text x="1021.0" y="648.0" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="14" fill="#111827" font-weight="600" text-anchor="middle">保存草稿</text><rect x="1124" y="620" width="178" height="46" rx="8" fill="#2563EB" stroke="none" stroke-width="1" opacity="1"/><g transform="translate(1173.0,635.0) scale(0.6666666666666666)"><path d="M20 6L9 17l-5-5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1197.0" y="648.0" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="start">提交审核</text><text x="934" y="692" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="11" fill="#9CA3AF" font-weight="400" text-anchor="start">提交即表示你确认商品信息真实、合法。</text></svg>